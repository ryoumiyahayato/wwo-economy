name: Import Gen23 economy sources once
on:
  push:
    branches: [sandbox/main]
    paths: ['.github/workflows/import-gen23-source.yml']
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify existing private release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download economy-gen23-closeout-20261024 --repo "$GITHUB_REPOSITORY" --pattern '01-source23.tar.gz' --dir "$RUNNER_TEMP"
          echo 'ae499943bd4a79c27086003d0b3b24b3acd030b50a508fb50c5557fa9d80102a  01-source23.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum --check)
          mkdir -p "$RUNNER_TEMP/gen23"
          tar -xzf "$RUNNER_TEMP/01-source23.tar.gz" -C "$RUNNER_TEMP/gen23"
      - name: Promote economy algorithm snapshots without duplicating the full game
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/gen23/baseline23"
          dest="experiments/global-commodity-gen23"
          if [ -d "$dest/source" ]; then echo 'Source snapshot already exists; refusing replacement'; exit 1; fi
          mkdir -p "$dest/source"
          shopt -s nullglob
          files=(
            "$src"/scripts/world/economy_*.gd
            "$src"/scripts/world/formal_world_economy_state.gd
            "$src"/scripts/world/formal_personal_economy_state.gd
            "$src"/scripts/world/formal_commodity_mapping.gd
            "$src"/scripts/world/formal_ledger_state.gd
            "$src"/scripts/world/global_commodity_reference.gd
            "$src"/scripts/simulation/formal_world_economy_simulation.gd
            "$src"/scripts/formal/formal_world_economy_view.gd
            "$src"/scripts/formal/formal_world_economic_static_view.gd
            "$src"/scripts/content/economy_development_config.gd
            "$src"/merchant/global_market.gd
            "$src"/merchant/global_market.tscn
            "$src"/merchant/global_market_map.gd
            "$src"/merchant/global_market_scenario.json
            "$src"/merchant/run_global_market.gd
            "$src"/merchant/merchant_save.gd
            "$src"/merchant/merchant_runtime.gd
          )
          test "${#files[@]}" -ge 40
          for file in "${files[@]}"; do
            rel="${file#${src}/}"
            mkdir -p "$dest/source/$(dirname "$rel")"
            cp "$file" "$dest/source/$rel"
          done
          cat > "$dest/README.md" <<'EOF'
# WWO第23代经济算法源码镜像（只读研究资料）

这里是独立经济实验室默认分支中的 **Godot GDScript 经济算法源码镜像**，从已归档的第23代候选提取。它供阅读、比较、审查；不是可单独启动的Godot项目，不是独立Simulation，也不代表已合入WWO正式世界。

- 当前版本：`merchant-global-commodity-20261023`（第23代）。
- 完整可恢复的候选源码、地图依赖、存档、校验记录：[第23代私有Release](https://github.com/ryoumiyahayato/wwo-economy-lab/releases/tag/economy-gen23-closeout-20261024)。
- 本目录 `source/` 保留与发布包相同相对路径下的经济、市场、账物相关源码。完整第23代工程源码在Release附件 `01-source23.tar.gz`，不是GitHub自动生成的Source code zip。
- 原游戏主仓库：[ryoumiyahayato/wwo](https://github.com/ryoumiyahayato/wwo)，默认 `canonical/current-world`；本镜像不会覆盖它。
- 正式国际实物贸易尚未完成；全球宏观估计调配不是可提取库存。第23代GUI冷恢复和本地单笔真实买卖已在隔离副本验证，但全球指数改变真实经营报价仍未证实。
- 这里不包括Godot地图大资源、玩家存档、导入缓存、政治军事模拟。上述完整恢复依赖在Release分卷。

为避免增加分支，镜像直接归档在现有默认 `sandbox/main` 的本目录；历史旧分支、旧标签均保留，尚未删改。
EOF
          count=$(find "$dest/source" -type f | wc -l)
          echo "Economy source files staged: $count"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git diff --cached --quiet && exit 0
          git commit -m 'archive: browseable gen23 economy algorithm source snapshot'
          git push origin HEAD:sandbox/main