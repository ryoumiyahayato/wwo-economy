name: Promote archived Gen23 into stable sandbox main once
on:
  push:
    branches: [sandbox/main]
    paths: ['.github/workflows/promote-gen23-root.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import only the verified Gen23 source archive into root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          archive="$RUNNER_TEMP/01-source23.tar.gz"
          gh release download economy-gen23-closeout-20261024 --repo "$repo" --pattern '01-source23.tar.gz' --dir "$RUNNER_TEMP"
          printf '%s\n' 'ae499943bd4a79c27086003d0b3b24b3acd030b50a508fb50c5557fa9d80102a  01-source23.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum --check)
          mkdir -p "$RUNNER_TEMP/gen23-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gen23-source"
          src="$RUNNER_TEMP/gen23-source/baseline23"
          test "$(find "$src" -type f | wc -l)" -eq 509
          test "$(find "$src" -type l | wc -l)" -eq 0
          test -f "$src/project.godot"
          test -f "$src/scripts/world/global_commodity_reference.gd"
          test -f "$src/merchant/global_market_map.gd"
          test ! -e project.godot
          cp -a "$src/." .
          test -f project.godot
          git rm -qr experiments/global-commodity-gen23/source
          printf '%s\n' '# 第23代源码目录已经提升到仓库根目录。' '' '本目录是过渡索引。当前经济候选的509个源码文件位于默认分支 sandbox/main 的根目录，主线脚本在 scripts/，经济地图在 merchant/。完整资源和存档仍在 economy-gen23-closeout-20261024 Release。' > experiments/global-commodity-gen23/README.md
          printf '\n# Rebuilt only from separate private release resource archives\n/assets/\n/data/\n/shared/\n/.godot/imported/\n' >> .gitignore
          git add -A .gitignore experiments/global-commodity-gen23 scripts merchant shaders project.godot export_presets.cfg research-goal02-source-selection-20261021.md
          git add -f .godot/global_script_class_cache.cfg
          python3 - <<'PY'
          from pathlib import Path
          expected=509
          root=Path('.')
          actual=sum(1 for p in (root/'scripts').rglob('*') if p.is_file()) + sum(1 for p in (root/'merchant').rglob('*') if p.is_file()) + sum(1 for p in (root/'shaders').rglob('*') if p.is_file()) + 4
          assert actual==expected,(actual,expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 1
          git commit -m 'baseline: promote archived economy gen23 sources to stable root'
          git push origin HEAD:sandbox/main