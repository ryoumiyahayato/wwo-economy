name: Archive production network once
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive verified immutable evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/archive_production_network_once.py
